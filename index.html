<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
</head>

<body>
    <main>
        <div class="scoreboard">
            <div class="top-section">
                <span class="section-name">TIME</span>
                <time id="main-time-container" class="timer" datetime="10:00">
                    <span id="min-timer">10</span>
                    <span id="colon-timer">:</span>
                    <span id="sec-timer">00</span>
                </time>
            </div>
            <div class="flex-row-container">
                <!-- HOME TEAM SECTION -->
                <div class="team-panel">
                    <span class="section-name">HOME</span>
                    <div class="team-panel-metadata ">
                        <span id="home-score" class="led-red-box">00</span>
                        <!-- BONUS Local Display: Light + Text -->
                        <div id="home-bonus-indicator" class="bonus-indicator">
                            <div class="bonus-light"></div>
                            <span class="bonus-text">BONUS</span>

                        </div>
                    </div>
                </div>
                <!-- Central section (POSS and PERIOD) -->
                <div class="game-info-panel">
                    <div class="poss-container">
                        <!-- Possession Arrows -->
                        <div id="home-poss-arrow" class="poss-arrow left-arrow active"></div>
                        <span class="central-text">POSS</span>
                        <div id="visitor-poss-arrow" class="poss-arrow right-arrow"></div>
                    </div>
                    <div class="period-container">
                        <span class="central-text">PERIOD</span>
                        <!-- Period number set to be green -->
                        <span id="period-number" class="period-score">1</span>
                    </div>
                </div>
                <!-- VISITOR TEAM SECTION -->
                <div class="team-panel">
                    <span class="section-name">VISITOR</span>
                    <div class="team-metadata">
                        <span id="visitor-score" class="led-red-box">00</span>
                        <!-- BONUS Visitor Sign: Text + Light (Reversed for symmetry) -->
                        <div id="visitor-bonus-indicator" class="bonus-indicator">
                            <div class="bonus-light"></div>
                            <span class="bonus-text">BONUS</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex-row-container">
                <div class="team-panel">
                    <span class="section-name"> FOULS </span>
                    <div class="fouls-metadata">
                        <span id="home-fouls-number" class="led-red-box">0 </span>
                        <div id="fouls-home-text-under-number" class="fouls-text">
                            <div class="tol-container">
                                <span class="bonus-text">TOL</span>
                                <span id="home-tol-number" class="tol-number">0</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="game-info-panel">
                    <span class="section-name"> SHOT CLOCK </span>
                    <time id="shot-clock-container" class="timer" datetime="00:24">
                        <span id="min-shot-clock">00</span>
                        <span id="colon-shot-clock">:</span>
                        <span id="sec-shot-clock">00</span>
                    </time>
                </div>
                <div class="team-panel">
                    <span class="section-name"> FOULS </span>
                    <div class="foul-metadata">
                        <span id="visitor-fouls-number" class="led-red-box">0</span>
                        <div id="foul-visitor-text-under-number" class="fouls-text">
                            <!-- Reemplaza tu actual span de TOL con esto debajo del recuadro de faltas -->
                            <div class="tol-container">
                                <span class="bonus-text">TOL</span>
                                <span id="visitor-tol-number" class="tol-number">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="control-panel" class="control-panel-board">
            <div id="home-control-panel" class="flex-column-container">
                <span class="sub-section-name"> HOME CONTROL PANEL </span>
                <div class="btn-grid">
                    <button id="home-add-one-btn" class="control-btn" data-action="score" data-team="home"
                        data-points="1">+1</button>
                    <button id="home-add-two-btn" class="control-btn" data-action="score" data-team="home"
                        data-points="2">+2</button>
                    <button id="home-add-three-btn" class="control-btn" data-action="score" data-team="home"
                        data-points="3">+3</button>
                    <button id="home-sub-one-btn" class="control-btn" data-action="score" data-team="home"
                        data-points="-1">-1</button>
                    <button id="home-add-foul-btn" class="control-btn" data-action="updateFouls" data-team="home"
                        data-amount="1">Add
                        Foul</button>
                    <button id="home-reset-foul-btn" class="control-btn" data-action="resetFouls" data-team="home">Reset
                        Foul</button>
                    <button id="home-tol-btn" class="control-btn" data-action="useTimeout" data-team="home">TOL</button>
                    <button id="home-sub-foul-btn" class="control-btn" data-action="updateFouls" data-team="home"
                        data-amount="-1">Sub Foul</button>
                </div>
            </div>
            <div id="game-control-panel" class="flex-column-container">
                <span class="sub-section-name"> GAME CONTROL PANEL </span>
                <div class="btn-grid">
                    <button id="start-pause-time-btn" class="control-btn" data-action="toggleGameClock">Start/Pause
                        timer</button>
                    <button id="reset-time-btn" class="control-btn" data-action="resetGameClock">Reset Time</button>
                    <button id="start-pause-shot-clock-btn" class="toggle-btn" data-action="toggleShotClock">Start/Pause
                        shot clock</button>
                    <button id="reset-shot-clock-btn" class="control-btn" data-action="resetShotClock">Reset Shot
                        Clock</button>
                    <button id="switch-poss-btn" class="toggle-btn" data-action="switchPossession">Switch POSS</button>
                    <button class="control-btn" data-action="nextPeriod">Next Period</button>
                </div>
            </div>
            <div id="visitor-control-panel" class="flex-column-container">
                <span class="sub-section-name"> VISITOR CONTROL PANEL </span>
                <div class="btn-grid">
                    <button id="visitor-add-one-btn" class="control-btn" data-action="score" data-team="visitor"
                        data-points="1">+1</button>
                    <button id="visitor-add-two-btn" class="control-btn" data-action="score" data-team="visitor"
                        data-points="2">+2</button>
                    <button id="visitor-add-three-btn" class="control-btn" data-action="score" data-team="visitor"
                        data-points="3">+3</button>
                    <button id="visitor-sub-one-btn" class="control-btn" data-action="score" data-team="visitor"
                        data-points="-1">-1</button>
                    <button id="visitor-add-foul-btn" class="control-btn" data-action="updateFouls" data-team="visitor"
                        data-amount="1">Add Foul</button>
                    <button id="visitor-reset-foul-btn" class="control-btn" data-action="resetFouls"
                        data-team="visitor">Reset Foul</button>
                    <button id="visitor-tol-button" class="control-btn" data-action="useTimeout"
                        data-team="visitor">TOL</button>
                    <button id="visitor-sub-foul-btn" class="control-btn" data-action="updateFouls" data-team="visitor"
                        data-amount="-1">Sub Foul</button>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="src/main.js">    </script>
</body>

</html>
