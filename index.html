<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body>
    <main>
        <div class="scoreboard">
            <div class="top-section">
                <span class="section-name">TIME</span>
                <time class="timer">
                    <span id="min-timer">00</span>
                    <span id="colon-timer">:</span>
                    <span id="sec-timer">00</span>
                </time>
            </div>
            <div class="flex-row-container">
                <!-- HOME TEAM SECTION -->
                <div class="team-panel">
                    <span class="section-name"> HOME </span>
                    <div class="team-metadata">
                        <span id="home-score" class="led-red-box">133</span>
                        <!-- BONUS Local Display: Light + Text -->
                        <div id="home-bonus-indicator" class="bonus-indicator">
                            <span class="bonus-text">BONUS</span>
                            <div class="bonus-ligth"></div>
                        </div>
                    </div>
                </div>
                <!-- Central section (POSS and PERIOD) -->
                <div class="game-info-panel">
                    <div class="poss-container">
                        <!-- Possession Arrows -->
                        <div id="home-poss-arrow" class="poss-arrow left-arrow"></div>
                        <span class="central-text">POSS</span>
                        <div id="visitor-poss-arrow" class="poss-arrow right-arrow"></div>
                    </div>
                    <div class="period-container">
                        <span class="central-text">PERIOD</span>
                        <!-- Period number set to be green -->
                        <span id="period-number" class="period-score">3</span>
                    </div>
                </div>
                <!-- VISITOR TEAM SECTION -->
                <div class="team-panel">
                    <span class="section-name">VISITOR</span>
                    <div class="team-metadata">
                        <span id="visitor-score" class="led-red-box">125</span>
                        <!-- BONUS Visitor Sign: Text + Light (Reversed for symmetry) -->
                        <div id="visitor-bonus-indicator" class="bonus-indicator">
                            <div class="bonus-light"></div>
                            <span class="bonus-text">BONUS</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex-row-container">
                <div class="team-panel">
                    <span class="section-name"> FOULS </span>
                    <div class="foul-metadata">
                        <span id="home-fouls-number" class="led-red-box">133 </span>
                        <span id="fouls-home-text-under-number" class="fouls-text">
                            <div class="tol-container">
                                <span class="bonus-text">TOL</span>
                                <span id="home-tol-number" class="tol-number">3</span>
                            </div>
                        </span>
                    </div>
                </div>
                <div class="game-info-panel">
                    <span id="min-timer-foul" class="section-name">FOULS PLAYER</span>
                    <time class="timer">
                        <span id="min-timer-foul">00</span>
                        <span id="colon-timer-foul">:</span>
                        <span id="sec-timer-foul">00</span>
                    </time>
                </div>
                <div class="team-panel">
                    <span class="section-name"> FOULS </span>
                    <div class="foul-metadata">
                        <span id="visitor-fouls-number" class="led-red-box">133</span>
                        <span id="foul-visitor-text-under-number" class="fouls-text">
                            <!-- Reemplaza tu actual span de TOL con esto debajo del recuadro de faltas -->
                            <div class="tol-container">
                                <span class="bonus-text">TOL</span>
                                <span id="visitor-tol-number" class="tol-number">3</span>
                            </div>
                        </span>
                    </div>
                </div>
            </div>
            <div class="shot-clock">
                <span class="section-name"> SHOT CLOCK </span>
                <time class="timer">
                    <span id="min-shot-clock">00</span>
                    <span id="colon-shot-clock">:</span>
                    <span id="sec-shot-clock">00</span>
                </time>
            </div>
        </div>
        <div id="control-panel" class="control-panel-board">
            <div id="home-control-panel" class="flex-column-container">
                <span class="sub-section-name"> HOME CONTROL PANEL </span>
                <div class="btn-grid">
                    <button id="home-add-one-btn" class="control-btn">+1</button>
                    <button id="home-add-two-btn" class="control-btn">+2</button>
                    <button id="home-add-three-btn" class="control-btn">+3</button>
                    <button id="home-add-foul-btn" class="control-btn">Home Foul</button>
                    <button id="home-bonus-toggle-btn" class="toggle-btn">Home Bonus</button>
                </div>
            </div>
            <div id="game-control-panel" class="flex-column-container">
                <span class="sub-section-name"> GAME CONTROL PANEL </span>
                <div class="btn-grid">
                    <button id="start-pause-time-btn" class="control-btn">Start/Pause</button>
                    <button id="reset-time-btn" class="control-btn">Reset Time</button>
                    <button id="start-pause-shot-clock-btn" class="toggle-btn">Start/Pause</button>
                    <button id="reset-shot-clock-btn" class="control-btn">Reset Shot Clock</button>
                    <button id="switch-poss-btn" class="toggle-btn">Switch POSS</button>
                </div>
            </div>
            <div id="visitor-control-panel" class="flex-column-container">
                <span class="sub-section-name"> VISITOR CONTROL PANEL </span>
                <div class="btn-grid">
                    <button id="visitor-add-one-btn" class="control-btn">+1</button>
                    <button id="visitor-add-two-btn" class="control-btn">+2</button>
                    <button id="visitor-add-three-btn" class="control-btn">+3</button>
                    <button id="visitor-add-foul-btn" class="control-btn">Visitor Foul</button>
                    <button id="visitor-bonus-toggle-btn" class="control-btn">Visitor Bonus</button>
                </div>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
</body>

</html>
