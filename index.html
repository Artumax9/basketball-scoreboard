<html>

<head>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
</head>

<body>
    <div class="scoreboard">
        <div class="top-page">
            <div class="timer">
                00:00
            </div>
        </div>
        <div class="bottom-page">
            <div class="team">
                <h2 class="team-name">HOME</h2>
                <h3 class="score">0</h3>
                <div class="puntuation">
                    <button class="points">+1</button>
                    <button class="points">+2</button>
                    <button class="points">+3</button>
                </div>
            </div>
            <div class="period-bonus">
                <div class="top-period">
                    <h3>BONUS</h3>
                    <h3>POSS</h3>
                </div>
                <div class="bottom-period">
                    <h2>PERIOD</h2>
                    <h3 class="period-score">0</h3>
                </div>
            </div>
            <div class="team">
                <h2 class="team-name">GUEST</h2>
                <h3 class="score">0</h3>
                <div class="puntuation">
                    <button class="points">+1</button>
                    <button class="points">+2</button>
                    <button class="points">+3</button>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
