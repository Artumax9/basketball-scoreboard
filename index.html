<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body>
    <main>
        <div class="scoreboard">
            <div class="top-section">
                <span class="team-name">TIME</span>
                <time class="timer">
                    <span id="min-timer">00</span>
                    <span id="colon-timer">:</span>
                    <span id="sec-timer">00</span>
                </time>
            </div>
            <div class="middle-section">
                <!-- HOME TEAM SECTION -->
                <div class="team">
                    <span class="team-name"> HOME </span>
                    <div class="team-metadata">
                        <span id="home-score" class="score-number">133 </span>
                        <!-- BONUS Local Display: Light + Text -->
                        <div id="home-bonus-indicator" class="bonus-indicator">
                            <span class="bonus-text">BONUS</span>
                            <div class="bonus-ligth"></div>
                        </div>
                    </div>
                </div>
                <!-- Central section (POSS and PERIOD) -->
                <div class="central-info">
                    <div class="poss-container">
                        <!-- Possession Arrows -->
                        <div id="home-poss-arrow" class="poss-arrow left-arrow"></div>
                        <span class="central-text">POSS</span>
                        <div id="visitor-poss-arrow" class="poss-arrow right-arrow"></div>
                    </div>
                    <div class="period-container">
                        <span class="central-text">PERIOD</span>
                        <!-- Period number set to be green -->
                        <span id="period-number" class="period-score">3</span>
                    </div>
                </div>
                <!-- VISITOR TEAM SECTION -->
                <div class="team">
                    <span class="team-name">VISITOR</span>
                    <div class="team-metadata">
                        <span id="visitor-score" class="score-number">125</span>
                        <!-- BONUS Visitor Sign: Text + Light (Reversed for symmetry) -->
                        <div id="visitor-bonus-indicator" class="bonus-indicator">
                            <div class="bonus-light"></div>
                            <span class="bonus-text">BONUS</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="stats-section">
                <div class="fouls-section">
                    <span class="fouls-name"> FOULS </span>
                    <div class="foul-metadata">
                        <span id="home-fouls-number" class="fouls-number">133 </span>
                        <span id="fouls-home-text-under-number" class="fouls-text">
                            <span class="bonus-text">TOL</span>
                        </span>
                    </div>
                </div>
                <div class="fouls-player-section">
                    <span id="min-timer-foul">FOULS PLAYER</span>
                    <time class="timer">
                        <span id="min-timer-foul">00</span>
                        <span id="colon-timer-foul">:</span>
                        <span id="sec-timer-foul">00</span>
                    </time>
                </div>
                <div class="fouls-section">
                    <span class="fouls-names"> FOULS </span>
                    <div class="foul-metadata">
                        <span id="visitor-fouls-number" class="fouls-number">133 </span>
                        <span id="foul-visitor-text-under-number" class="fouls-text">
                            <span class="bonus-text">TOL</span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="shot-clock">
                <span class="fouls-names"> SHOT CLOCK </span>
                <time class="timer">
                    <span id="min-shot-clock">00</span>
                    <span id="colon-shot-clock">:</span>
                    <span id="sec-shot-clock">00</span>
                </time>
            </div>
        </div>
        <div class="control-panel">
            <div class="scoring-controls">
                <div id="home-control">
                    <button class="score-btn">+1</button>
                    <button class="score-btn">+2</button>
                    <button class="score-btn">+3</button>
                </div>
                <div id="visitor-control">
                    <button class="score-btn">+1</button>
                    <button class="score-btn">+2</button>
                    <button class="score-btn">+3</button>
                </div>
            </div>

        </div>
    </main>
    <script src="index.js"></script>
</body>

</html>
